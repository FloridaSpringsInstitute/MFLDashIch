name: Update Ichetucknee Flow Plot

# Controls when the workflow will run
on:
  schedule:
   - cron: '0 11 * * *' #Runs 11:00 UTC daily, ~6-7am EST
  workflow_dispatch: #Also allows for manual trigger
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: install.packages(c("dataRetrieval","dplyr", "plotly","scico", "htmlwidgets"))
        shell: Rscript {0}
      - name: Run script
        run: Rscript "Ichetucknee MFL Stripe Dashboard.R"
      - name: Commit updated plot
       run: |
        git config user.name "github-actions"
        gitconfig user.emal "actions@github.com"
        git add docs/ichetucknee_legal_minimum_flow.html
        git commit -m "Daily flow update" || echo "No changes"
        git push
